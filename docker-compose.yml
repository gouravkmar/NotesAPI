x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DATABASE_PATH: /data/db.sqlite

services:
  app:
    image: notesapi:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    ports:
      - '8081:8080'
    volumes:
      - ./data:/data
    user: "1000:1000"
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
  migrate:
    image: notesapi:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    volumes:
      - ./data:/data
    user: "1000:1000"
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0
  revert:
    image: notesapi:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    volumes:
      - ./data:/data
    user: "1000:1000"
    command: ["migrate", "--revert", "--yes"]
    deploy:
      replicas: 0
